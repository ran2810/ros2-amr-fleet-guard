# Nav2 parameters for ONE warehouse AMR. 
# navigation.launch.py renders this file per robot:
#   __NS__          -> robot_1, robot_2, ...   (TF frames are prefixed, topics are namespaced)
#   __X__/__Y__/__YAW__ -> the robot's dock pose (AMCL initial pose)
# and wraps everything under the robot namespace, so one template serves N independent stacks.
#
# Light on CPU on purpose: NavFn (A*) planner, Regulated Pure Pursuit controller,
# no smoother server / waypoint follower / collision monitor, small costmaps, 60 AMCL beams.
# If a parameter is rejected by your Nav2 version, diff against
#   /opt/ros/jazzy/share/nav2_bringup/params/nav2_params.yaml

amcl:
  ros__parameters:
    use_sim_time: true
    # odometry noise model: the simulated odometry is ideal, so keep these small
    # (the 0.2 real-robot defaults made map->odom jitter and the robot weave in the aisles)
    alpha1: 0.05
    alpha2: 0.05
    alpha3: 0.05
    alpha4: 0.05
    alpha5: 0.05
    base_frame_id: "__NS__/base_link"
    odom_frame_id: "__NS__/odom"
    global_frame_id: "map"
    scan_topic: scan
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    laser_model_type: "likelihood_field"
    laser_min_range: -1.0
    laser_max_range: 12.0
    laser_likelihood_max_dist: 2.0
    max_beams: 60
    min_particles: 200
    max_particles: 1000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    sigma_hit: 0.2
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    do_beamskip: false
    update_min_a: 0.1   # smaller steps: AMCL corrects the pose sooner after a bump
    update_min_d: 0.1
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    save_pose_rate: 0.5
    tf_broadcast: true
    transform_tolerance: 1.0
    set_initial_pose: true
    always_reset_initial_pose: true
    initial_pose:
      x: __X__
      y: __Y__
      z: 0.0
      yaw: __YAW__

map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ""          # set by navigation.launch.py
    topic_name: "map"
    frame_id: "map"

# Planning map: the true map with the whole rack block closed. The global costmap plans on it, so routes
# stay on the wide ring lanes (the 2 m aisles are too narrow for two robots to pass). AMCL keeps using
# the true map above.
nav_map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ""          # set by navigation.launch.py
    topic_name: "nav_map"
    frame_id: "map"

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: "__NS__/base_link"
    odom_topic: odom
    bt_loop_duration: 10
    default_server_timeout: 200   # ms the BT waits for an action server to ACK a goal; the default 20 ms
                                  # timed out on a CPU-bound laptop ("... acknowledge goal request for follow_path")
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    transform_tolerance: 0.5
    navigators: ["navigate_to_pose"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    odom_topic: odom
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.10
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.6
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      transform_tolerance: 0.2
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25
      use_cost_regulated_linear_velocity_scaling: false
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.785
      rotate_to_heading_angular_vel: 1.0
      max_angular_accel: 2.5
      allow_reversing: false
      max_robot_pose_search_dist: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: "__NS__/odom"
      robot_base_frame: "__NS__/base_link"
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      footprint: "[ [0.275, 0.20], [0.275, -0.20], [-0.275, -0.20], [-0.275, 0.20] ]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan robots
        scan:
          topic: scan
          data_type: "LaserScan"
          marking: true
          clearing: true
          max_obstacle_height: 2.0
          raytrace_max_range: 4.0
          raytrace_min_range: 0.0
          obstacle_max_range: 3.5
          obstacle_min_range: 0.0
        # The scan plane (0.21 m) passes above the other robots' chassis (0.18 m), so each robot_agent
        # publishes the other robots' TF poses as filled discs of points; mark-only, latest message only.
        # The cloud is in 'map', so the range is measured from the map origin: keep it large.
        robots:
          topic: other_robots
          data_type: "PointCloud2"
          marking: true
          clearing: false
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          obstacle_max_range: 100.0
          obstacle_min_range: 0.0
          observation_persistence: 0.0
          expected_update_rate: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.0   # slower decay: planner prefers the middle of the 2 m aisles
        inflation_radius: 0.8
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: "__NS__/base_link"
      resolution: 0.05
      footprint: "[ [0.275, 0.20], [0.275, -0.20], [-0.275, -0.20], [-0.275, 0.20] ]"
      track_unknown_space: false
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: "/__NS__/nav_map"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan robots
        scan:
          topic: scan
          data_type: "LaserScan"
          marking: true
          clearing: true
          max_obstacle_height: 2.0
          raytrace_max_range: 4.0
          raytrace_min_range: 0.0
          obstacle_max_range: 3.5
          obstacle_min_range: 0.0
        # The scan plane (0.21 m) passes above the other robots' chassis (0.18 m), so each robot_agent
        # publishes the other robots' TF poses as filled discs of points; mark-only, latest message only.
        # The cloud is in 'map', so the range is measured from the map origin: keep it large.
        robots:
          topic: other_robots
          data_type: "PointCloud2"
          marking: true
          clearing: false
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          obstacle_max_range: 100.0
          obstacle_min_range: 0.0
          observation_persistence: 0.0
          expected_update_rate: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.0   # slower decay: planner prefers the middle of the 2 m aisles
        inflation_radius: 0.8
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: true
      allow_unknown: false

behavior_server:
  ros__parameters:
    use_sim_time: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: "__NS__/odom"
    global_frame: map
    robot_base_frame: "__NS__/base_link"
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 2.5

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.7, 0.0, 1.5]
    min_velocity: [-0.3, 0.0, -1.5]
    max_accel: [1.0, 0.0, 2.5]
    max_decel: [-1.0, 0.0, -2.5]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

lifecycle_manager_localization:
  ros__parameters:
    use_sim_time: true
    autostart: true
    bond_timeout: 8.0
    node_names: ["map_server", "nav_map_server", "amcl"]

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: true
    autostart: true
    bond_timeout: 8.0
    node_names: ["controller_server", "planner_server", "behavior_server", "bt_navigator", "velocity_smoother"]
